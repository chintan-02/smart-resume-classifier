name: ResumeIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: .
  RESUMEIQ_APP_ENV: ci
  RESUMEIQ_DATABASE_URL: sqlite:///./test_resumeiq_ci.db
  RESUMEIQ_LOG_LEVEL: INFO
  RESUMEIQ_MLFLOW_TRACKING_URI: file:./mlruns
  RESUMEIQ_MODEL_REGISTRY_PATH: artifacts/model_registry/model_registry.json

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database initialization smoke test
        run: python -m database.init_db

      - name: Run tests
        run: pytest

      - name: FastAPI import smoke test
        run: |
          python - <<'PY'
          from backend.main import app
          print(app.title)
          PY

      - name: Validate Docker Compose config
        run: docker compose config

  docker-build:
    runs-on: ubuntu-latest

    env:
      RESUMEIQ_DATABASE_URL: sqlite:///./data/resumeiq.db
      RESUMEIQ_API_BASE_URL: http://api:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build FastAPI image
        run: docker compose build api

      - name: Build Streamlit image
        run: docker compose build streamlit
